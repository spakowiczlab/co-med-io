<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Graphical abstract</title>
  <desc id="desc">Summary of Spakowicz et al., BMC Cancer 2020. Antibiotics and corticosteroids, but not other microbiome-related medications, were associated with shorter overall survival in 690 patients treated with immune checkpoint inhibitors. The signal depends on timing, remains after clinical adjustment, and is strongest for beta-lactams, consistent with a microbiome role.</desc>
  <rect width="960" height="700" fill="#FBFCFD"/>

  <!-- header -->
  <text x="32" y="36" fill="#1A759F" font-size="12" font-weight="700" letter-spacing="1.4">GRAPHICAL ABSTRACT</text>
  <text x="32" y="64" fill="#16324F" font-size="22" font-weight="700">Antibiotics, corticosteroids, and survival on checkpoint inhibitors</text>
  <text x="32" y="88" fill="#5C6B7A" font-size="14">690 patients with advanced cancer | OSUCCC-James, 2011-2017 | no stool sequencing</text>

  <!-- A. causal path -->
  <rect x="32" y="108" width="896" height="168" rx="12" fill="#F4F8FA" stroke="#E1E8EE"/>
  <text x="48" y="132" fill="#1A759F" font-size="13" font-weight="700">A</text>
  <text x="66" y="132" fill="#16324F" font-size="13" font-weight="700">Causal model used to choose what to measure</text>

  <!-- nodes -->
  <g font-size="12" font-weight="600" fill="#16324F" text-anchor="middle">
    <rect x="48" y="152" width="148" height="64" rx="8" fill="#FFFFFF" stroke="#77D1E5" stroke-width="2"/>
    <text x="122" y="176">Antibiotics</text>
    <text x="122" y="194">Corticosteroids</text>

    <rect x="236" y="152" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#7DCEA0" stroke-width="2"/>
    <circle cx="286" cy="176" r="5" fill="#7DCEA0"/>
    <circle cx="300" cy="184" r="3.5" fill="#1F8A5B"/>
    <rect x="308" y="172" width="14" height="7" rx="3.5" fill="#A8DDB8"/>
    <text x="306" y="204">Gut microbiome</text>

    <rect x="416" y="152" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#C5B6D6" stroke-width="2"/>
    <text x="491" y="178">T-cell</text>
    <text x="491" y="196">inflammation</text>

    <rect x="606" y="152" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#E2BF99" stroke-width="2"/>
    <text x="676" y="178">ICI</text>
    <text x="676" y="196">response</text>

    <rect x="786" y="152" width="122" height="64" rx="8" fill="#16324F"/>
    <text x="847" y="188" fill="#F7F4EE">Survival</text>
  </g>

  <!-- arrows between nodes -->
  <g fill="none" stroke="#8AA0B2" stroke-width="1.6" stroke-linecap="round">
    <path d="M196 184 H228"/>
    <path d="M376 184 H408"/>
    <path d="M566 184 H598"/>
    <path d="M746 184 H778"/>
  </g>
  <g fill="#8AA0B2">
    <path d="M228 184 l-7 -4 v8 z"/>
    <path d="M408 184 l-7 -4 v8 z"/>
    <path d="M598 184 l-7 -4 v8 z"/>
    <path d="M778 184 l-7 -4 v8 z"/>
  </g>

  <text x="48" y="248" fill="#5C6B7A" font-size="12">PPI, H2 blockers, NSAIDs, and statins were also abstracted. Across the cohort they were not associated with overall survival.</text>

  <!-- B timing -->
  <rect x="32" y="292" width="288" height="292" rx="12" fill="#FFFFFF" stroke="#E1E8EE"/>
  <text x="48" y="316" fill="#1A759F" font-size="13" font-weight="700">B</text>
  <text x="66" y="316" fill="#16324F" font-size="13" font-weight="700">Timing</text>
  <text x="48" y="338" fill="#5C6B7A" font-size="12">30-day windows, schematic</text>

  <!-- chart frame -->
  <line x1="64" y1="360" x2="64" y2="470" stroke="#C5D0D8" stroke-width="1.2"/>
  <line x1="64" y1="470" x2="292" y2="470" stroke="#C5D0D8" stroke-width="1.2"/>
  <line x1="64" y1="430" x2="292" y2="430" stroke="#C5D0D8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="433" fill="#8AA0B2" font-size="10">1</text>
  <text x="56" y="486" fill="#8AA0B2" font-size="10">-180</text>
  <text x="168" y="486" fill="#8AA0B2" font-size="10" text-anchor="middle">ICI start</text>
  <text x="292" y="486" fill="#8AA0B2" font-size="10" text-anchor="end">+180</text>
  <line x1="178" y1="360" x2="178" y2="470" stroke="#E1E8EE" stroke-width="1"/>

  <!-- ABx: elevated before ICI, secondary peak near day 50, smaller peak at 0, stays above 1 -->
  <path d="M64 392 C88 368 108 366 124 382 C140 396 148 374 162 380 C176 386 200 398 230 412 C255 422 275 426 292 428"
        fill="none" stroke="#14556E" stroke-width="2.4" stroke-linecap="round"/>
  <!-- CS: single peak at ICI start, remaining below the antibiotic curve -->
  <path d="M64 424 C100 422 140 418 162 408 C172 400 178 396 188 404 C210 418 250 424 292 428"
        fill="none" stroke="#E07A5F" stroke-width="2.4" stroke-linecap="round"/>

  <circle cx="52" cy="512" r="4" fill="#14556E"/>
  <text x="62" y="516" fill="#16324F" font-size="12">Antibiotics</text>
  <circle cx="150" cy="512" r="4" fill="#E07A5F"/>
  <text x="160" y="516" fill="#16324F" font-size="12">Corticosteroids</text>
  <text x="48" y="544" fill="#5C6B7A" font-size="12">Only these two medications</text>
  <text x="48" y="560" fill="#5C6B7A" font-size="12">associated with shorter survival.</text>

  <!-- C adjustment -->
  <rect x="336" y="292" width="288" height="292" rx="12" fill="#FFFFFF" stroke="#E1E8EE"/>
  <text x="352" y="316" fill="#1A759F" font-size="13" font-weight="700">C</text>
  <text x="370" y="316" fill="#16324F" font-size="13" font-weight="700">Adjusted association</text>

  <!-- mini KM -->
  <line x1="360" y1="348" x2="360" y2="448" stroke="#C5D0D8" stroke-width="1.2"/>
  <line x1="360" y1="448" x2="520" y2="448" stroke="#C5D0D8" stroke-width="1.2"/>
  <path d="M364 368 H400 V378 H440 V386 H480 V394 H516" fill="none" stroke="#8AA0B2" stroke-width="2.2" stroke-linejoin="miter"/>
  <path d="M364 384 H392 V400 H432 V414 H472 V424 H516" fill="none" stroke="#77D1E5" stroke-width="2.2" stroke-linejoin="miter"/>
  <path d="M364 396 H384 V418 H424 V434 H464 V442 H516" fill="none" stroke="#E07A5F" stroke-width="2.2" stroke-linejoin="miter"/>
  <text x="528" y="376" fill="#5C6B7A" font-size="11">Neither</text>
  <text x="528" y="406" fill="#5C6B7A" font-size="11">One drug</text>
  <text x="528" y="436" fill="#5C6B7A" font-size="11">Both</text>

  <text x="352" y="478" fill="#16324F" font-size="12">Cox model covariates</text>
  <text x="352" y="498" fill="#5C6B7A" font-size="12">ECOG, CCI, stage, BMI, age, sex</text>
  <text x="352" y="522" fill="#5C6B7A" font-size="12">Effects were additive. In</text>
  <text x="352" y="538" fill="#5C6B7A" font-size="12">cancer-specific models, antibiotics</text>
  <text x="352" y="554" fill="#5C6B7A" font-size="12">stayed in for bladder cancer,</text>
  <text x="352" y="570" fill="#5C6B7A" font-size="12">melanoma, and renal cell carcinoma.</text>

  <!-- D class -->
  <rect x="640" y="292" width="288" height="292" rx="12" fill="#FFFFFF" stroke="#E1E8EE"/>
  <text x="656" y="316" fill="#1A759F" font-size="13" font-weight="700">D</text>
  <text x="674" y="316" fill="#16324F" font-size="13" font-weight="700">Antibiotic class and taxa</text>

  <text x="656" y="346" fill="#5C6B7A" font-size="11">Order across cancers, schematic</text>
  <text x="656" y="370" fill="#16324F" font-size="12">beta-lactams</text>
  <rect x="748" y="358" width="160" height="14" rx="3" fill="#14556E"/>
  <text x="656" y="392" fill="#16324F" font-size="12">Other classes</text>
  <rect x="748" y="380" width="96" height="14" rx="3" fill="#77D1E5"/>
  <text x="656" y="414" fill="#16324F" font-size="12">Linezolid</text>
  <rect x="748" y="402" width="36" height="14" rx="3" fill="#C5D0D8"/>

  <text x="656" y="444" fill="#16324F" font-size="12">Susceptibility vs ICI literature</text>
  <rect x="656" y="456" width="252" height="36" rx="6" fill="#E7F6EE"/>
  <text x="668" y="472" fill="#1F8A5B" font-size="12" font-weight="700">Firmicutes</text>
  <text x="668" y="486" fill="#1F4D38" font-size="11">Enriched in responders; beta-lactams active</text>
  <rect x="656" y="498" width="252" height="36" rx="6" fill="#FDEEE9"/>
  <text x="668" y="514" fill="#A14B36" font-size="12" font-weight="700">Bacteroidetes</text>
  <text x="668" y="528" fill="#6E3A2C" font-size="11">Enriched in non-responders; often spared</text>
  <text x="656" y="562" fill="#5C6B7A" font-size="12">Cephalosporins also target</text>
  <text x="656" y="576" fill="#5C6B7A" font-size="12">Akkermansia muciniphila.</text>

  <!-- footer -->
  <rect x="32" y="604" width="896" height="72" rx="12" fill="#0E3C52"/>
  <text x="48" y="632" fill="#F7F4EE" font-size="14" font-weight="700">Consistent with a microbiome contribution to ICI response.</text>
  <text x="48" y="654" fill="#D5E6EE" font-size="13">Largest plausible role in NSCLC, melanoma, renal cell, head and neck, and bladder cancer.</text>
</svg>
