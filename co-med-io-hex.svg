<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" role="img" aria-labelledby="title desc">
  <title id="title">co-med-io hex sticker</title>
  <desc id="desc">Pointed hex sticker: a capsule, three microbes, and two survival curves, labelled co-med-io.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#1C7C96"/>
      <stop offset="55%" stop-color="#14556E"/>
      <stop offset="100%" stop-color="#0C3344"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner">
      <polygon points="100,15 187.47,65.5 187.47,166.5 100,217 12.53,166.5 12.53,65.5"/>
    </clipPath>
    <clipPath id="capsule">
      <rect x="-40" y="-15" width="80" height="30" rx="15"/>
    </clipPath>
  </defs>

  <!-- sticker border -->
  <polygon points="100,6 195.26,61 195.26,171 100,226 4.74,171 4.74,61" fill="#F4EFE6"/>
  <polygon points="100,15 187.47,65.5 187.47,166.5 100,217 12.53,166.5 12.53,65.5" fill="url(#field)"/>

  <g clip-path="url(#inner)">
    <ellipse cx="78" cy="48" rx="70" ry="42" fill="url(#gloss)"/>

    <!-- concomitant medication -->
    <g transform="translate(100 70) rotate(-18)">
      <g clip-path="url(#capsule)">
        <rect x="-40" y="-15" width="40" height="30" fill="#F7F4EE"/>
        <rect x="0" y="-15" width="40" height="30" fill="#77D1E5"/>
      </g>
      <rect x="-40" y="-15" width="80" height="30" rx="15" fill="none" stroke="#0C3344" stroke-width="1.4" opacity="0.35"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#0C3344" stroke-width="1" opacity="0.28"/>
    </g>

    <!-- microbiome mediator -->
    <circle cx="74" cy="104" r="7" fill="#C8EBD4"/>
    <circle cx="96" cy="108" r="4.6" fill="#7DCEA0"/>
    <rect x="108" y="100" width="20" height="10" rx="5" fill="#A8DDB8"/>

    <!-- overall survival -->
    <path d="M44 114 V152 H158" fill="none" stroke="#F4EFE6" stroke-width="1.15" stroke-linecap="square" opacity="0.5"/>
    <path d="M46 122 H70 V127 H94 V131 H118 V136 H156" fill="none" stroke="#F7F3EA" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M46 130 H64 V138 H88 V145 H110 V149 H156" fill="none" stroke="#F2997A" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>

    <text x="100" y="184" text-anchor="middle"
          font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="16" font-weight="700" fill="#F7F4EE" letter-spacing="-0.3">co-med-io</text>
  </g>
</svg>
